<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_导航组件 / 04_状态栏 / 黑色</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.rat {
    width: 7.5rem;
    height: 0.88rem;
    margin: 0 auto;
    overflow: hidden;
    background-color: rgba(255, 255, 255, 1);
}
.valley {
    display: flex;
    width: 7.5rem;
    height: 0.88rem;
    background-color: rgba(255, 255, 255, 1);
    align-items: center;
}
.pence {
    width: 0.44rem;
    height: 0.22rem;
    margin-left: 6.72rem;
    border: 0.02rem solid rgba(0, 0, 0, 0.35);
    border-radius: 0.06rem;
}
.unconditional {
    width: 0.36rem;
    height: 0.14rem;
    margin-left: 0.02rem;
    background-color: rgba(34, 34, 34, 1);
    border-radius: 0.02rem;
}
.feather {
    width: 0.02rem;
    height: 0.08rem;
    margin-left: 0.02rem;
    background-color: rgba(0, 0, 0, 0.4);
}
.zoo {
    width: 0.3rem;
    height: 0.22rem;
    margin-left: -0.88rem;
    background-color: rgba(34, 34, 34, 1);
}
.build {
    width: 0.3rem;
    height: 0.1rem;
    background-color: rgba(0, 0, 0, 1);
}
.field {
    position: relative;
    width: 0.2rem;
    height: 0.08rem;
    margin: -0.02rem 0 0 0.06rem;
    background-color: rgba(0, 0, 0, 1);
}
.nationality {
    width: 0.1rem;
    height: 0.06rem;
    margin-left: 0.1rem;
    background-color: rgba(0, 0, 0, 1);
}
.salad {
    display: flex;
    width: 0.34rem;
    height: 0.22rem;
    margin-left: -0.74rem;
    background-color: rgba(34, 34, 34, 1);
}
.ferry {
    width: 0.06rem;
    height: 0.08rem;
    margin: 0.12rem 0 0 0rem;
    background-color: rgba(0, 0, 0, 1);
}
.building {
    width: 0.06rem;
    height: 0.12rem;
    margin: 0.08rem 0 0 0.04rem;
    background-color: rgba(0, 0, 0, 1);
}
.limit {
    width: 0.06rem;
    height: 0.16rem;
    margin: 0.04rem 0 0 0.02rem;
    background-color: rgba(0, 0, 0, 1);
}
.stewardess {
    width: 0.06rem;
    height: 0.22rem;
    margin: 0rem 0 0 0.04rem;
    background-color: rgba(0, 0, 0, 1);
}
.water {
    display: flex;
    width: 0.56rem;
    height: 0.22rem;
    margin-left: -5.56rem;
    background-color: rgba(34, 34, 34, 1);
}
.manage {
    width: 0.16rem;
    height: 0.22rem;
    padding-top: 0.002rem;
    margin: 0rem 0 0 0rem;
}
.path {
    width: 0.08rem;
    height: 0.08rem;
    margin: 0.04rem 0 0 0.04rem;
}
.example {
    width: 0.04rem;
    height: 0.04rem;
    margin: 0.04rem 0 0 0.04rem;
    border-radius: 50%;
}
.purple {
    width: 0.04rem;
    height: 0.04rem;
    margin: 0.14rem 0 0 -0.04rem;
    border-radius: 50%;
}
.valid {
    width: 0.16rem;
    height: 0.22rem;
    padding-top: 0.002rem;
    margin: 0rem 0 0 0.04rem;
}
.hurry {
    width: 0.06rem;
    height: 0.12rem;
    margin: 0.04rem 0 0 0.04rem;
}
.argue {
    width: 0.1rem;
    height: 0.22rem;
    margin: 0rem 0 0 0.04rem;
}

    </style>
</head>
<body>
<div class="rat">
    <div class="valley">
        <div class="pence">
            <div class="unconditional">

            </div>
        </div>
        <div class="feather">

        </div>
        <div class="zoo">
            <div class="build">

            </div>
            <div class="field">

            </div>
            <div class="nationality">

            </div>
        </div>
        <div class="salad">
            <div class="ferry">

            </div>
            <div class="building">

            </div>
            <div class="limit">

            </div>
            <div class="stewardess">

            </div>
        </div>
        <div class="water">
            <div class="manage">
                <div class="path">

                </div>
            </div>
            <div class="example">

            </div>
            <div class="purple">

            </div>
            <div class="valid">
                <div class="hurry">

                </div>
            </div>
            <div class="argue">

            </div>
        </div>
    </div>
</div>
</body>
</html>
