<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>btn/分段/高亮</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.rat {
    width: 7.02rem;
    height: 0.88rem;
    margin: 0 auto;
    overflow: hidden;
    background-color: rgba(255, 255, 255, 1);
    border-radius: 0.16rem;
}
.valley {
    width: 3.38rem;
    height: 0.88rem;
    padding-top: 0.002rem;
    margin-left: 3.64rem;
    background-color: rgba(23, 82, 255, 1);
    border-radius: 0.16rem;
}
.pence {
    width: 0.36rem;
    height: 0.5rem;
    margin: 0.2rem 0 0 1.48rem;
    font-family: PingFangSC-Medium;
    font-size: 0.36rem;
    font-weight: 500;
    line-height: 0.5rem;
    color: rgba(255, 255, 255, 1);
    text-align: center;
}
.unconditional {
    position: relative;
    width: 3.38rem;
    height: 0.88rem;
    padding-top: 0.002rem;
    margin-top: -0.88rem;
    background-color: rgba(222, 231, 255, 1);
    border-radius: 0.16rem;
}
.feather {
    width: 0.36rem;
    height: 0.5rem;
    margin: 0.2rem 0 0 1.52rem;
    font-family: PingFangSC-Medium;
    font-size: 0.36rem;
    font-weight: 500;
    line-height: 0.5rem;
    color: rgba(23, 82, 255, 1);
    text-align: center;
}

    </style>
</head>
<body>
<div class="rat">
    <div class="valley">
        <div class="pence">
            主
        </div>
    </div>
    <div class="unconditional">
        <div class="feather">
            次
        </div>
    </div>
</div>
</body>
</html>
